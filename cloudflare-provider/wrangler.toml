name = "duckmail-cloudflare-provider"
main = "worker.ts"
compatibility_date = "2024-12-01"
account_id = "16feb2508c920d0cd79a8c60c4d8c430"
# Keep the *.workers.dev URL the DuckMail web app calls.
workers_dev = true

[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "temp_mail_db"
database_id = "70bece35-d5bf-487b-9730-c7546f0266c3"

[vars]
# Public domains: listed by GET /domains; anyone can create an account.
MAIL_DOMAIN = "10xco.de"
# Private domains: mail is still received and stored, but the public API
# never lists them, refuses POST /accounts (403) and refuses logins that the
# admin did not create. Read this mail at /admin.
PRIVATE_DOMAINS = "llab08.com"
# Optional forwarding after storing, JSON {"address":"verified destination"},
# e.g. {"name@llab08.com":"you@example.com"}. The destination must be a
# verified Email Routing destination address. Empty = no forwarding.
FORWARD_RULES = ""

# `wrangler deploy` refuses to deploy while any of these is missing.
[secrets]
required = ["JWT_SECRET", "ADMIN_PASSWORD_HASH", "ADMIN_SESSION_SECRET", "CLIENT_IP_SECRET"]

# Secrets — set with `wrangler secret put` (see README.md),
# never in this file:
#   JWT_SECRET            signs the API tokens, 32+ characters. Replaces the old
#                         JWT_TOKEN var, whose value is in the public git history;
#                         the Worker never falls back to JWT_TOKEN.
#   ADMIN_PASSWORD_HASH   pbkdf2-sha256$<iterations>$<salt b64>$<hash b64>
#   ADMIN_SESSION_SECRET  signs the /admin session cookie
#   CLIENT_IP_SECRET      32+ characters, the same value as the DuckMail web app's
#                         server env var CLIENT_IP_SECRET: lets its /api/mail proxy
#                         pass each browser's IP (signed) for the /token limits

# Local development: `npx wrangler dev` (local D1 only, nothing remote), with
# the secrets above in .dev.vars (see .dev.vars.example).
